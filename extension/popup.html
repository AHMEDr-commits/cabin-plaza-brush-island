<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loreweave</title>
    <style>
      body { margin: 0; width: 280px; background: #0d0c0b; color: #f0ebe3; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
      main { padding: 16px; }
      h1 { font: 600 18px Georgia, serif; margin: 0 0 6px; }
      p { color: #9c948a; margin: 0 0 12px; }
      button { height: 36px; width: 100%; border: 0; border-radius: 8px; background: #8ea0b0; color: #0d0c0b; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
      a { color: #8ea0b0; }
    </style>

  <body>
    <main>
      <h1>Loreweave</h1>
      <p>Stories, memory, and the web.</p>

      <button id="opts" style="background:transparent;color:#f0ebe3;border:1px solid #2a2622">Settings</button>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
